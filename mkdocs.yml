site_name: APB ProteoBench
site_url: https://anndata-omics-bridge.github.io/apb-proteobench/
repo_url: https://github.com/anndata-omics-bridge/apb-proteobench
docs_dir: docs
site_dir: public
theme:
  name: material
nav:
  - Home: index.md
  - Guides:
      - End-to-end workflow: workflow.md
      - Module configuration: configuration.md
      - Result layout: results.md
  - Reference:
      - Command-line interface: cli.md
      - Python API: api.md
  - Architecture: architecture.md
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
