# Sample design, species quantities and run files live in the module SDRF.
# This file holds the scoring settings the SDRF cannot express.
sdrf = "dia_diapasef.sdrf.tsv"

[species.YEAST]
organism = "saccharomyces cerevisiae"
suffix = "_YEAST"
color = "#88ccef"

[species.ECOLI]
organism = "escherichia coli"
suffix = "_ECOLI"
color = "#cc6777"

[species.HUMAN]
organism = "homo sapiens"
suffix = "_HUMAN"
color = "#ddcc77"

[general]
"min_count_multispec" = 1
"level" = "ion"

# Further run names that vendor tables report, keyed by SDRF comment[data file].
[run_aliases]
"ttSCP_diaPASEF_Condition_A_Sample_Alpha_01_11494.d" = ["LFQ_ttSCP_diaPASEF_Condition_A_Sample_Alpha_01"]
"ttSCP_diaPASEF_Condition_A_Sample_Alpha_02_11500.d" = ["LFQ_ttSCP_diaPASEF_Condition_A_Sample_Alpha_02"]
"ttSCP_diaPASEF_Condition_A_Sample_Alpha_03_11506.d" = ["LFQ_ttSCP_diaPASEF_Condition_A_Sample_Alpha_03"]
"ttSCP_diaPASEF_Condition_B_Sample_Alpha_01_11496.d" = ["LFQ_ttSCP_diaPASEF_Condition_B_Sample_Alpha_01"]
"ttSCP_diaPASEF_Condition_B_Sample_Alpha_02_11502.d" = ["LFQ_ttSCP_diaPASEF_Condition_B_Sample_Alpha_02"]
"ttSCP_diaPASEF_Condition_B_Sample_Alpha_03_11508.d" = ["LFQ_ttSCP_diaPASEF_Condition_B_Sample_Alpha_03"]

[reference_database]
# Reference protein database used to validate uploaded protein identifiers.
# Read by proteobench.validation (ModuleValidationConfig).
"fasta_url" = "https://proteobench.cubimed.rub.de/fasta/ProteoBenchFASTA_MixedSpecies_HYE.zip"

[validation]
# Validation profile applied to submissions for this module.
# Resolved by proteobench.validation (ModuleValidationConfig.from_parse_settings).
"profile" = "quant_lfq"
