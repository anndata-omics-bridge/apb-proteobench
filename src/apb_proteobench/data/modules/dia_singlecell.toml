# Sample design, species quantities and run files live in the module SDRF.
# This file holds the scoring settings the SDRF cannot express.
sdrf = "dia_singlecell.sdrf.tsv"

[species.YEAST]
organism = "saccharomyces cerevisiae"
suffix = "_YEAST"
color = "#88ccef"

[species.HUMAN]
organism = "homo sapiens"
suffix = "_HUMAN"
color = "#ddcc77"

[general]
"min_count_multispec" = 1
"level" = "ion"

# Further run names that vendor tables report, keyed by SDRF comment[data file].
[run_aliases]
"20231123_DIA_240k_20Th_40ms_FAIMSCV-48_gas3p8_240pg_10pg_H_Y_r1.raw" = ["20231123_DIA_240k_20Th_40ms_FAIMSCV-48_gas3p8_240pg_10pg_H_Y_r1_uncalibrated"]
"20231123_DIA_240k_20Th_40ms_FAIMSCV-48_gas3p8_240pg_10pg_H_Y_r2.raw" = ["20231123_DIA_240k_20Th_40ms_FAIMSCV-48_gas3p8_240pg_10pg_H_Y_r2_uncalibrated"]
"20231123_DIA_240k_20Th_40ms_FAIMSCV-48_gas3p8_240pg_10pg_H_Y_r3.raw" = ["20231123_DIA_240k_20Th_40ms_FAIMSCV-48_gas3p8_240pg_10pg_H_Y_r3_uncalibrated"]
"20231123_DIA_240k_20Th_40ms_FAIMSCV-48_gas3p8_200pg_50pg_H_Y_r1.raw" = ["20231123_DIA_240k_20Th_40ms_FAIMSCV-48_gas3p8_200pg_50pg_H_Y_r1_uncalibrated"]
"20231123_DIA_240k_20Th_40ms_FAIMSCV-48_gas3p8_200pg_50pg_H_Y_r2.raw" = ["20231123_DIA_240k_20Th_40ms_FAIMSCV-48_gas3p8_200pg_50pg_H_Y_r2_uncalibrated"]
"20231123_DIA_240k_20Th_40ms_FAIMSCV-48_gas3p8_200pg_50pg_H_Y_r3.raw" = ["20231123_DIA_240k_20Th_40ms_FAIMSCV-48_gas3p8_200pg_50pg_H_Y_r3_uncalibrated"]

[reference_database]
# Reference protein database used to validate uploaded protein identifiers.
# Read by proteobench.validation (ModuleValidationConfig).
"fasta_url" = "https://proteobench.cubimed.rub.de/fasta/ProteoBenchFASTA_MixedSpecies_HY.zip"

[validation]
# Validation profile applied to submissions for this module.
# Resolved by proteobench.validation (ModuleValidationConfig.from_parse_settings).
"profile" = "quant_lfq"
