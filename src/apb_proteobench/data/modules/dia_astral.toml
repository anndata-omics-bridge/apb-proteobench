# Sample design, species quantities and run files live in the module SDRF.
# This file holds the scoring settings the SDRF cannot express.
sdrf = "dia_astral.sdrf.tsv"

[species.YEAST]
organism = "saccharomyces cerevisiae"
suffix = "_YEAST"
color = "#88ccef"

[species.ECOLI]
organism = "escherichia coli"
suffix = "_ECOLI"
color = "#cc6777"

[species.HUMAN]
organism = "homo sapiens"
suffix = "_HUMAN"
color = "#ddcc77"

[general]
"min_count_multispec" = 1
"level" = "ion"

# Further run names that vendor tables report, keyed by SDRF comment[data file].
[run_aliases]
"LFQ_Astral_DIA_15min_50ng_Condition_A_REP1.raw" = ["LFQ_Astral_DIA_15min_50ng_Condition_A_REP1_uncalibrated"]
"LFQ_Astral_DIA_15min_50ng_Condition_A_REP2.raw" = ["LFQ_Astral_DIA_15min_50ng_Condition_A_REP2_uncalibrated"]
"LFQ_Astral_DIA_15min_50ng_Condition_A_REP3.raw" = ["LFQ_Astral_DIA_15min_50ng_Condition_A_REP3_uncalibrated"]
"LFQ_Astral_DIA_15min_50ng_Condition_B_REP1.raw" = ["LFQ_Astral_DIA_15min_50ng_Condition_B_REP1_uncalibrated"]
"LFQ_Astral_DIA_15min_50ng_Condition_B_REP2.raw" = ["LFQ_Astral_DIA_15min_50ng_Condition_B_REP2_uncalibrated"]
"LFQ_Astral_DIA_15min_50ng_Condition_B_REP3.raw" = ["LFQ_Astral_DIA_15min_50ng_Condition_B_REP3_uncalibrated"]

[reference_database]
# Reference protein database used to validate uploaded protein identifiers.
# Read by proteobench.validation (ModuleValidationConfig).
"fasta_url" = "https://proteobench.cubimed.rub.de/fasta/ProteoBenchFASTA_MixedSpecies_HYE.zip"

[validation]
# Validation profile applied to submissions for this module.
# Resolved by proteobench.validation (ModuleValidationConfig.from_parse_settings).
"profile" = "quant_lfq"
