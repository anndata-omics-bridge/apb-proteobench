# Sample design, species quantities and run files live in the module SDRF.
# This file holds the scoring settings the SDRF cannot express.
# SDRF quantities: PYE9 of Distler et al. 2025, a 1:9 dilution in human plasma of PYE1
# (A 90/2/8, B 90/6/4 % w/w human/yeast/E. coli); 200 ng injected.
sdrf = "dia_plasma.sdrf.tsv"

[species.YEAST]
organism = "saccharomyces cerevisiae"
suffix = "_YEAST"
color = "red"

[species.ECOLI]
organism = "escherichia coli"
suffix = "_ECOLI"
color = "blue"

[species.HUMAN]
organism = "homo sapiens"
suffix = "_HUMAN"
color = "green"

[general]
"min_count_multispec" = 1
"level" = "ion"
"max_nr_observed" = 12

# Further run names that vendor tables report, keyed by SDRF comment[data file].
[run_aliases]
"A9_G_DIA_nLC_tTOF_R1.d" = ["LFQ_Plasma_Condition_A_Sample_Alpha_01"]
"A9_G_DIA_nLC_tTOF_R2.d" = ["LFQ_Plasma_Condition_A_Sample_Alpha_02"]
"A9_G_DIA_nLC_tTOF_R3.d" = ["LFQ_Plasma_Condition_A_Sample_Alpha_03"]
"A9_G_DIA_nLC_tTOF_R4.d" = ["LFQ_Plasma_Condition_A_Sample_Alpha_04"]
"A9_G_DIA_nLC_tTOF_R5.d" = ["LFQ_Plasma_Condition_A_Sample_Alpha_05"]
"A9_G_DIA_nLC_tTOF_R6.d" = ["LFQ_Plasma_Condition_A_Sample_Alpha_06"]
"B9_G_DIA_nLC_tTOF_R1.d" = ["LFQ_Plasma_Condition_B_Sample_Alpha_01"]
"B9_G_DIA_nLC_tTOF_R2.d" = ["LFQ_Plasma_Condition_B_Sample_Alpha_02"]
"B9_G_DIA_nLC_tTOF_R3.d" = ["LFQ_Plasma_Condition_B_Sample_Alpha_03"]
"B9_G_DIA_nLC_tTOF_R4.d" = ["LFQ_Plasma_Condition_B_Sample_Alpha_04"]
"B9_G_DIA_nLC_tTOF_R5.d" = ["LFQ_Plasma_Condition_B_Sample_Alpha_05"]
"B9_G_DIA_nLC_tTOF_R6.d" = ["LFQ_Plasma_Condition_B_Sample_Alpha_06"]

[reference_database]
# Reference protein database used to validate uploaded protein identifiers.
# Read by proteobench.validation (ModuleValidationConfig).
"fasta_url" = "https://proteobench.cubimed.rub.de/fasta/ProteoBenchFASTA_MixedSpecies_HYE.zip"

[validation]
# Validation profile applied to submissions for this module.
# Resolved by proteobench.validation (ModuleValidationConfig.from_parse_settings).
"profile" = "quant_lfq"
