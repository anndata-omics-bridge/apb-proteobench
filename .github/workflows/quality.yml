name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apb-proteobench
    steps:
      - name: Check out APB ProteoBench
        uses: actions/checkout@v6
        with:
          path: apb-proteobench

      - name: Check out compatible APB2
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/apb2
          ref: 1d904e664ce1322f852235730287695bfed487b5
          path: apb2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Synchronize environment
        run: uv sync --frozen --group dev --group docs

      - name: Run quality gates
        run: make check
