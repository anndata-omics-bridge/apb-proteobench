name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apb-proteobench
    steps:
      - name: Check out APB ProteoBench
        uses: actions/checkout@v6
        with:
          path: apb-proteobench

      - name: Check out compatible APB2
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/apb2
          ref: 5863d2ef019ddbb32c1c8052e28a73e99fa1da15
          path: apb2

      - name: Check out compatible APB FASTA
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/apb-fasta
          ref: 86b1fc07c0351e49e3e313fcda8efba80f84306e
          path: apb-fasta

      - name: Check out compatible protein-fasta
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/protein-fasta
          ref: d7630105a67b09e12d044443cf1d4c04cf04d44b
          path: protein_fasta

      - name: Check out compatible Prozor
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/prozor
          ref: 4191a2a6e190a3f7671674593596d6b2baa4e3e1
          path: prozor

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Synchronize environment
        run: uv sync --frozen --group dev --group docs

      - name: Run quality gates
        run: make check
