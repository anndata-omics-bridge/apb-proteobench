name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apb-proteobench
    steps:
      - name: Check out APB ProteoBench
        uses: actions/checkout@v6
        with:
          path: apb-proteobench

      - name: Check out compatible APB2
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/apb2
          ref: f73c2d5535899c20e27339657f449c715219dd58
          path: apb2

      - name: Check out compatible APB Catalog
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/apb-catalog
          ref: 491f2c1959594e127642a0066d1cab70c0781b5c
          path: apb-catalog

      - name: Check out compatible APB FASTA
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/apb-fasta
          ref: 38582c1adf169769a6428c4556d0d3b66b518023
          path: apb-fasta

      - name: Check out compatible protein-fasta
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/protein-fasta
          ref: 130ca357046b911cf024f50ac0d3cb8c5c46ee67
          path: protein_fasta

      - name: Check out compatible Prozor
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/prozor
          ref: ee08f2d91d76b44b7c69b208cab88075c4fb8019
          path: prozor

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Build documentation
        run: uv run --group docs zensical build --clean --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apb-proteobench/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
